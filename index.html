<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>描圖運筆生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style id="pagesize">@page{size:A4 portrait;margin:0}</style>
<style>
:root{
  --bg:#F2F8F8;--panel:#FFFFFF;--ink:#12343B;--muted:#56717A;--teal:#028090;--orange:#E8552D;--amber:#F4A93C;--line:#D3E4E5;--soft:#E7F3F3;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{--bg:#0F2A30;--panel:#163940;--ink:#EAF4F4;--muted:#A9C3C6;--line:#2C5158;--soft:#1B444B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Huninn","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.top{display:flex;align-items:center;gap:18px;padding:20px 24px 6px;max-width:1440px;margin:0 auto}
.hero{width:92px;height:92px;flex:none;background:#fff;border-radius:24px;border:2px dashed var(--line);display:grid;place-items:center}
.hero svg{width:76px;height:76px}
.hero .guide .dot{fill:#C3D2D4;stroke:none}
.hero .draw > *:not(.dot){stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-in-out forwards}
.hero .draw .dot{fill:#E8552D;stroke:none;opacity:0;animation:pop .35s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.hero .draw > *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}
.top h1{margin:0;font-size:clamp(24px,4vw,34px);font-weight:400;letter-spacing:.05em}
.top p{margin:6px 0 0;color:var(--muted);font-size:15px;line-height:1.6;max-width:42em}

.app{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:22px;padding:12px 24px 48px;max-width:1440px;margin:0 auto;align-items:start}
.ctrl{background:var(--panel);border-radius:22px;padding:4px 20px 18px;border:1px solid var(--line)}
.sec{padding:16px 0 14px;border-top:2px dashed var(--line)}
.sec:first-child{border-top:0}
.sec h3{margin:0 0 10px;font-size:15.5px;font-weight:400;color:var(--teal);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3 small{color:var(--muted);font-size:13px}
.hint{margin:9px 0 0;font-size:13.5px;color:var(--muted);line-height:1.6}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.mini,.chips button{padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font-size:14.5px;line-height:1.2}
.seg button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tabs button{flex:1;padding:12px 10px;font-size:16px}
.tabs button.on{background:var(--orange);border-color:var(--orange)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button span{font-size:12px;opacity:.75;margin-left:2px}
.chips button.on{background:var(--amber);border-color:var(--amber);color:#3a2400}
.chips button.part{border-color:var(--amber)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;margin-top:10px;max-height:236px;overflow:auto;padding:3px}
.thumb{aspect-ratio:1;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:5px;cursor:pointer;opacity:.32;transition:opacity .15s,border-color .15s}
.thumb.on{opacity:1;border-color:var(--amber)}
.thumb svg{width:100%!important;height:100%!important;display:block}
.row-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mini{font-size:13.5px;padding:7px 12px}
.fld{display:block;font-size:14.5px;margin:4px 0 10px}
.fld input{display:block;width:100%;margin-top:6px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-size:15px;background:var(--panel);color:var(--ink)}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;font-size:14.5px;cursor:default}
.num{display:flex;align-items:center;gap:6px}
.num button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font-size:17px;line-height:1}
.num output{min-width:2.2em;text-align:center;font-size:16px}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:#CBDADC;position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw:checked{background:var(--teal)}
.sw:checked::after{transform:translateX(18px)}
.hide{display:none!important}

.prev{min-width:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);padding:6px 0 12px}
.count{flex:1;color:var(--muted);font-size:14.5px;min-width:10em}
.btn-main{background:var(--orange);color:#fff;border:0;border-radius:999px;padding:12px 22px;font-size:16px;cursor:pointer}
.tip{width:100%;margin:0;font-size:13px;color:var(--muted)}
.pages{display:flex;flex-direction:column;align-items:center;gap:20px}
.empty{padding:60px 20px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:22px;width:100%}

/* ---------- paper ---------- */
.page{position:relative;overflow:hidden;background:#fff;color:#12343B;flex:none;box-shadow:0 1px 0 #D3E4E5,0 12px 30px rgba(2,128,144,.10);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pic .dot{fill:var(--dot);stroke:none}
.hd{position:absolute;left:var(--m);right:var(--m);top:var(--m);height:var(--hd);display:flex;align-items:center;gap:calc(4mm*var(--f));border-bottom:calc(.7mm*var(--f)) dashed #F4A93C}
.ttl{flex:1;min-width:0;font-size:calc(8.4mm*var(--f));color:#028090;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hf{display:flex;align-items:flex-end;gap:calc(1.6mm*var(--f));font-size:calc(4.3mm*var(--f));color:#3D5A60}
.hf i{display:inline-block;width:calc(30mm*var(--f));height:calc(6mm*var(--f));border-bottom:.3mm solid #8FA3A7;margin-right:calc(2mm*var(--f))}
.hf i.sh{width:calc(20mm*var(--f))}
.sts{display:flex;gap:calc(.8mm*var(--f))}
.sts svg{width:calc(7.5mm*var(--f));height:calc(7.5mm*var(--f))}
.grid{position:absolute;left:var(--m);right:var(--m);display:grid}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;border:.35mm solid #DBE6E7;border-radius:calc(3.5mm*var(--f));min-width:0;min-height:0}
.cell.blank{border:.45mm dashed #C3D4D6;background:#FBFDFD}
.cell .art{display:flex;align-items:center;justify-content:center}
.lab{font-size:calc(4.1mm*var(--f));color:#56717A;line-height:1;margin-top:calc(1.6mm*var(--f));white-space:nowrap}
.ft{position:absolute;left:var(--m);right:var(--m);bottom:var(--m);height:var(--ft);display:flex;justify-content:space-between;align-items:flex-end;font-size:calc(3.6mm*var(--f));color:#7F969B}

.cv{position:absolute;inset:var(--m);display:flex;flex-direction:column;align-items:center;justify-content:space-between;border:calc(.8mm*var(--f)) dashed #F4A93C;border-radius:calc(8mm*var(--f));padding:calc(10mm*var(--f)) calc(8mm*var(--f))}
.cv-row{display:flex;gap:calc(9mm*var(--f));justify-content:center}
.cv-t{font-size:calc(15mm*var(--f));color:#E8552D;text-align:center;line-height:1.25}
.cv-s{font-size:calc(5.6mm*var(--f));color:#028090;margin-top:calc(-4mm*var(--f))}
.cv-me{width:calc(82mm*var(--f));height:calc(82mm*var(--f));border:.5mm dashed #A9B9BC;border-radius:calc(7mm*var(--f));display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(3mm*var(--f));font-size:calc(4.6mm*var(--f));color:#A9B9BC}
.cv-own,.ce-s{display:flex;align-items:flex-end;gap:calc(3mm*var(--f));font-size:calc(6mm*var(--f))}
.cv-own i,.ce-s i,.ce-l i{display:inline-block;width:calc(70mm*var(--f));height:calc(9mm*var(--f));border-bottom:.4mm solid #12343B}
.ce-t{font-size:calc(19mm*var(--f));color:#E8552D}
.ce-l{display:flex;flex-direction:column;align-items:center;gap:calc(4mm*var(--f));font-size:calc(6mm*var(--f));text-align:center;line-height:1.5}
.ce-s{font-size:calc(5mm*var(--f))}
.ce-s i{width:calc(42mm*var(--f))}
.ce-s i.sh{width:calc(32mm*var(--f))}
.sts.big svg{width:calc(15mm*var(--f));height:calc(15mm*var(--f))}

.docin{position:absolute;inset:var(--m);padding:calc(4mm*var(--f)) calc(4mm*var(--f))}
.docin h2{margin:0 0 calc(4mm*var(--f));font-weight:400;font-size:calc(10mm*var(--f));color:#028090}
.docin h3{margin:calc(8mm*var(--f)) 0 calc(2mm*var(--f));font-weight:400;font-size:calc(6.4mm*var(--f));color:#E8552D}
.docin .lead,.docin p{font-size:calc(5mm*var(--f));line-height:1.7;margin:0}
.docin ol{margin:calc(5mm*var(--f)) 0 0;padding-left:calc(8mm*var(--f));font-size:calc(5mm*var(--f));line-height:1.6}
.docin li{margin-bottom:calc(3.4mm*var(--f))}
.docin li b{display:block;font-weight:400;color:#028090;font-size:calc(5.6mm*var(--f))}
.rec{width:100%;border-collapse:collapse;margin-top:calc(6mm*var(--f));table-layout:fixed}
.rec th{font-weight:400;font-size:calc(4.2mm*var(--f));color:#56717A;padding:calc(2mm*var(--f)) 0;border-bottom:.5mm solid #F4A93C}
.rec td{border:.3mm solid #DBE6E7;text-align:center;vertical-align:middle;font-size:calc(4.6mm*var(--f));color:#028090}
.rec td svg{width:calc(8mm*var(--f));height:calc(8mm*var(--f))}
.rec .fav{width:22%}
.rec .wk{width:12%}

@media (max-width:860px){
  .app{grid-template-columns:1fr;padding:10px 14px 40px}
  .top{padding:16px 14px 4px}
  .hero{width:72px;height:72px;border-radius:20px}
  .hero svg{width:58px;height:58px}
}
@media print{
  :root{padding:0!important}
  body{background:#fff}
  .top,.ctrl,.bar{display:none!important}
  .app{display:block;padding:0;max-width:none;margin:0}
  .pages{zoom:1!important;display:block}
  .page{box-shadow:none!important;margin:0;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<header class="top">
  <div class="hero" id="hero" aria-hidden="true"></div>
  <div>
    <h1>描圖運筆生成器</h1>
    <p>50 種可愛圖案和 50 種基本幾何圖形，沿著線描一描。可以印單頁學習單，也可以做成每週一本的練習手冊。</p>
  </div>
</header>

<main class="app">
  <aside class="ctrl">
    <div class="sec">
      <div class="seg tabs" data-k="tab">
        <button data-v="single">單頁學習單</button>
        <button data-v="book">每週手冊</button>
      </div>
    </div>

    <div class="sec">
      <h3>圖庫 <small id="selCount"></small></h3>
      <div class="seg" data-k="lib" style="margin-bottom:10px">
        <button data-v="pic">可愛圖案 50 種</button>
        <button data-v="geo">基本幾何 50 種</button>
      </div>
      <p class="hint" id="libHint" style="margin:0 0 10px"></p>
      <div class="chips" id="chips"></div>
      <div class="thumbs" id="thumbs"></div>
      <div class="row-btns">
        <button class="mini" id="selAll">全選</button>
        <button class="mini" id="selNone">全部取消</button>
        <button class="mini" id="shuffle">換一組排列</button>
      </div>
    </div>

    <div class="sec">
      <h3>練習方式</h3>
      <div class="seg" data-k="mode">
        <button data-v="trace">描圖</button>
        <button data-v="copy">描一個畫一個</button>
        <button data-v="prog">由描到畫</button>
      </div>
      <p class="hint" id="modeHint"></p>
    </div>

    <div class="sec" id="secStyle">
      <h3>描線樣式</h3>
      <div class="seg" data-k="style">
        <button data-v="bold">特粗虛線</button>
        <button data-v="light">淡色實線</button>
        <button data-v="dash">粗虛線</button>
        <button data-v="dot">點點線</button>
        <button data-v="fine">細虛線</button>
      </div>
      <p class="hint" id="styleHint"></p>
    </div>

    <div class="sec">
      <h3>每頁圖案數</h3>
      <div class="seg" data-k="n" id="nSeg"></div>
    </div>

    <div class="sec only-single">
      <h3>學習單</h3>
      <label class="fld">標題<input type="text" data-k="title" maxlength="20"></label>
      <div class="field"><span>頁數</span><div class="num" data-k="pages" data-min="1" data-max="30"><button aria-label="減少">−</button><output></output><button aria-label="增加">＋</button></div></div>
      <label class="field only-trace"><span>同一個圖案排滿整頁</span><input type="checkbox" class="sw" data-k="repeat"></label>
    </div>

    <div class="sec only-book">
      <h3>手冊</h3>
      <label class="fld">手冊名稱<input type="text" data-k="btitle" maxlength="16"></label>
      <div class="field"><span>週數</span><div class="num" data-k="weeks" data-min="1" data-max="12"><button aria-label="減少">−</button><output></output><button aria-label="增加">＋</button></div></div>
      <div class="field"><span>每週練習天數</span><div class="num" data-k="days" data-min="1" data-max="7"><button aria-label="減少">−</button><output></output><button aria-label="增加">＋</button></div></div>
      <label class="field"><span>線條逐週變淡變少</span><input type="checkbox" class="sw" data-k="progress"></label>
      <p class="hint">手冊包含封面、給大人的說明、練習紀錄表、每天一頁的練習和完成證書。</p>
    </div>

    <div class="sec">
      <h3>紙張與版面</h3>
      <div class="seg" data-k="paper">
        <button data-v="A4">A4</button>
        <button data-v="A5">A5</button>
      </div>
      <label class="field"><span>綠色起點</span><input type="checkbox" class="sw" data-k="start"></label>
      <label class="field"><span>下筆方向箭頭</span><input type="checkbox" class="sw" data-k="arrows"></label>
      <label class="field"><span>顯示圖案名稱</span><input type="checkbox" class="sw" data-k="names"></label>
      <label class="field"><span>頁首完成星星</span><input type="checkbox" class="sw" data-k="stars"></label>
    </div>
  </aside>

  <section class="prev">
    <div class="bar">
      <span class="count" id="count"></span>
      <button class="btn-main" id="print">列印／存成 PDF</button>
      <p class="tip">列印時邊界選「無」、縮放 100%；要存檔就在印表機選「另存為 PDF」。</p>
    </div>
    <div class="pages" id="pages"></div>
  </section>
</main>

<script>
const CATS={pic:[{id:'animal',name:'動物'},{id:'fruit',name:'蔬果'},{id:'life',name:'生活'},{id:'nature',name:'自然'}],
  geo:[{id:'line',name:'直線'},{id:'curve',name:'曲線'},{id:'shape',name:'形狀'}]};
const range=n=>Array.from({length:n},(_,i)=>i+1);
const dots=(arr,r)=>arr.map(([x,y])=>`<circle class="dot" cx="${x}" cy="${y}" r="${r}"/>`).join('');
const P=(id,name,cat,s)=>({id,name,cat,s});
const PICS=[
P('cat','貓咪','animal',`<path d="M25 46 L22 16 L40 31 Q50 28 60 31 L78 16 L75 46 Q80 82 50 83 Q20 82 25 46 Z"/>${dots([[40,52],[60,52]],3.2)}<path class="dot" d="M46 60 L54 60 L50 65 Z"/><path d="M50 65 Q46 71 41 68 M50 65 Q54 71 59 68"/><path d="M30 60 L12 56 M30 66 L12 68 M70 60 L88 56 M70 66 L88 68"/>`),
P('dog','小狗','animal',`<circle cx="50" cy="52" r="26"/><path d="M30 36 Q12 36 14 64 Q22 72 28 62"/><path d="M70 36 Q88 36 86 64 Q78 72 72 62"/>${dots([[41,48],[59,48]],3.2)}<ellipse class="dot" cx="50" cy="60" rx="5" ry="3.6"/><path d="M50 63 L50 69 Q45 74 40 70 M50 69 Q55 74 60 70"/>`),
P('rabbit','兔子','animal',`<path d="M41 42 Q30 6 39 5 Q48 6 47 40"/><path d="M59 42 Q70 6 61 5 Q52 6 53 40"/><ellipse cx="50" cy="62" rx="27" ry="23"/>${dots([[40,60],[60,60]],3.2)}<path class="dot" d="M46.5 67 L53.5 67 L50 71 Z"/><path d="M50 71 Q46 77 42 74 M50 71 Q54 77 58 74"/>`),
P('bird','小鳥','animal',`<path d="M18 58 Q20 30 48 30 Q68 30 73 46 L88 50 L73 56 Q68 78 44 78 Q22 78 18 58 Z"/><path d="M32 56 Q46 46 56 62 Q44 70 32 56 Z"/>${dots([[61,43]],3)}<path d="M42 78 L40 90 M54 78 L56 90"/>`),
P('fish','小魚','animal',`<path d="M18 50 Q44 20 72 50 Q44 80 18 50 Z"/><path d="M72 50 L90 34 L88 50 L90 66 Z"/>${dots([[31,46]],3)}<path d="M42 38 Q49 50 42 62"/><circle cx="12" cy="30" r="3.5"/><circle cx="20" cy="18" r="2.5"/>`),
P('turtle','烏龜','animal',`<path d="M20 64 Q22 28 50 28 Q78 28 80 64 Z"/><path d="M36 64 L40 46 L60 46 L64 64 M40 46 L44 30 M60 46 L56 30"/><path d="M80 58 Q86 48 93 54 Q96 64 82 64"/>${dots([[88,55]],2)}<path d="M28 64 L26 76 L38 76 L38 64"/><path d="M62 64 L62 76 L74 76 L72 64"/><path d="M20 62 L10 66 L20 66"/>`),
P('pig','小豬','animal',`<circle cx="50" cy="54" r="28"/><path d="M30 34 L26 16 L42 28"/><path d="M70 34 L74 16 L58 28"/><ellipse cx="50" cy="63" rx="12" ry="8.5"/>${dots([[45.5,63],[54.5,63]],2.2)}${dots([[39,46],[61,46]],3)}`),
P('bear','小熊','animal',`<circle cx="50" cy="56" r="27"/><path d="M29 40 A10 10 0 1 1 41 30"/><path d="M71 40 A10 10 0 1 0 59 30"/><ellipse cx="50" cy="65" rx="11" ry="8.5"/><ellipse class="dot" cx="50" cy="61" rx="4.2" ry="3"/><path d="M50 64 L50 68 Q46 71 43 68 M50 68 Q54 71 57 68"/>${dots([[40,50],[60,50]],3.2)}`),
P('chick','小雞','animal',`<circle cx="50" cy="54" r="27"/><path d="M46 27 Q46 16 51 22 Q54 14 57 27"/><path class="dot" d="M45 54 L55 54 L50 61 Z"/>${dots([[41,46],[59,46]],3)}<path d="M25 58 Q16 62 22 72"/><path d="M75 58 Q84 62 78 72"/><path d="M42 81 L40 90 L34 93 M40 90 L45 93 M58 81 L60 90 L55 93 M60 90 L66 93"/>`),
P('butterfly','蝴蝶','animal',`<path d="M50 32 L50 78"/><path d="M50 42 Q28 12 16 28 Q12 48 50 50"/><path d="M50 42 Q72 12 84 28 Q88 48 50 50"/><path d="M50 53 Q22 54 24 72 Q34 84 50 62"/><path d="M50 53 Q78 54 76 72 Q66 84 50 62"/><path d="M50 32 Q46 22 40 18 M50 32 Q54 22 60 18"/>${dots([[40,18],[60,18]],2.4)}`),
P('snail','蝸牛','animal',`<path d="M14 74 L86 74 Q92 74 90 68 Q88 64 80 64"/><path d="M32 72 Q28 34 54 30 Q78 28 80 52 Q80 68 62 68 Q46 68 46 54 Q46 44 56 44 Q64 44 64 52 Q64 58 58 58"/><path d="M14 74 Q12 64 20 60 L16 46 M22 62 L26 44"/>${dots([[16,45],[26,43]],2.6)}`),

function picSVG(pic,key,mm,start,color,wmm,half){

// dot styles: evenly spaced dots along each line, plus a dot on every corner/end point so the shape stays readable
function vertices(el){
  if(el.tagName!=='path')return [];
  const out=[];let sx=0,sy=0;
  (el.getAttribute('d').match(/[MLTQCAZ][^MLTQCAZ]*/gi)||[]).forEach(seg=>{
    const c=seg[0].toUpperCase(),n=(seg.slice(1).match(/-?\d*\.?\d+/g)||[]).map(Number);
    let p=null;
    if(c==='M'||c==='L'||c==='T')p=[n[0],n[1]];else if(c==='Q')p=[n[2],n[3]];else if(c==='C')p=[n[4],n[5]];else if(c==='A')p=[n[5],n[6]];
    if(c==='M'){sx=n[0];sy=n[1];}
    if(p&&!isNaN(p[0]))out.push(p);
  });
  return out;
}

      vertices(e).forEach(([x,y])=>{if(!near(x,y,sp*.35))pts.push([x,y]);});
      const n=Math.max(1,Math.round(L/sp));
      for(let i=0;i<=n;i++){const p=e.getPointAtLength(L*i/n);if(!near(p.x,p.y,sp*.6))pts.push([p.x,p.y]);}
    });
    svg.insertAdjacentHTML('beforeend',`<g fill="${c}">${pts.map(([x,y])=>`<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${r}"/>`).join('')}</g>`);
    svg.classList.remove('dt');
  });
}
function addStarts(root){
  root.querySelectorAll('svg.ns').forEach(svg=>{
    const k=+svg.dataset.k,r=1.3*k;let out='';
    svg.querySelectorAll('g > *:not(.dot)').forEach(e=>{
      try{const L=e.getTotalLength();if(L<18)return;const p=e.getPointAtLength(0);
        out+=`<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${r.toFixed(2)}" fill="#2BA84A" stroke="#fff" stroke-width="${(0.35*k).toFixed(2)}"/>`;
        if(S.arrows&&L>14*k){const s=Math.min(9*k,L*.35),a=e.getPointAtLength(s-.5*k),b=e.getPointAtLength(s+.5*k);
          const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI,c=e.getPointAtLength(s),z=1.7*k;
          out+=`<path d="M${(-z).toFixed(2)} ${(-z).toFixed(2)} L${z.toFixed(2)} 0 L${(-z).toFixed(2)} ${z.toFixed(2)}" fill="none" stroke="#E8552D" stroke-width="${(0.6*k).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round" transform="translate(${c.x.toFixed(2)} ${c.y.toFixed(2)}) rotate(${ang.toFixed(1)})"/>`;}
      }catch(_){}
    });
    svg.insertAdjacentHTML('beforeend',out);svg.classList.remove('ns');
  });
}
const pageOpen=(d,cls)=>`<div class="page ${cls}" style="width:${d.w}mm;height:${d.h}mm;--m:${d.m}mm;--hd:${d.hd}mm;--ft:${d.ft}mm;--f:${d.f}">`;
const header=t=>`<div class="hd"><div class="ttl">${esc(t)}</div><div class="hf"><span>名字</span><i></i><span>日期</span><i class="sh"></i></div>${S.stars?`<div class="sts">${STAR.repeat(3)}</div>`:''}</div>`;
const footer=l=>`<div class="ft"><span>${esc(l||'')}</span><span>${S.start?'從綠點出發，沿著線慢慢描':'沿著線慢慢描，畫歪沒關係'}</span></div>`;

function layout(mode,pics,key){
  const cells=[];let cols,rows;const n=pics.length;
  if(mode==='trace'){
    pics.forEach(p=>cells.push({pic:p,key,label:p.name}));
    [cols,rows]={1:[1,1],2:[1,2],3:[1,3],4:[2,2],6:[2,3]}[n]||[2,Math.ceil(n/2)];
  }else if(mode==='copy'){
    pics.forEach(p=>{cells.push({pic:p,key,label:p.name});cells.push({blank:1,label:'換你畫'});});
    [cols,rows]=n===1?[1,2]:[2,n];
  }else{
    const st=[['light','照著描'],['dash','沿著虛線'],['half','描一半 畫一半'],[null,'自己畫']];
    pics.forEach(p=>st.forEach(([k,l],i)=>cells.push(k==='half'?{pic:p,key:'dash',half:1,label:l}:k?{pic:p,key:k,label:i===0?`${p.name} ${l}`:l}:{blank:1,label:l})));
    [cols,rows]=n===1?[2,2]:[4,n];
  }
  return {cells,cols,rows};
}
function sheet(title,{cells,cols,rows},footL){
  const d=D(),gap=4*d.f,W=d.w-2*d.m,H=d.h-2*d.m-d.hd-d.ft-6*d.f;
  const cw=(W-(cols-1)*gap)/cols,ch=(H-(rows-1)*gap)/rows;
  const lab=S.names?6.5*d.f:0,pad=3.5*d.f;
  const size=Math.max(12,Math.min(cw-2*pad,ch-lab-2*pad));
  let h=pageOpen(d,'ws')+header(title);
  h+=`<div class="grid" style="top:calc(var(--m) + var(--hd) + ${3*d.f}mm);height:${H}mm;grid-template-columns:repeat(${cols},minmax(0,1fr));grid-template-rows:repeat(${rows},minmax(0,1fr));gap:${gap}mm">`;
  cells.forEach(c=>{
    h+=`<div class="cell${c.blank?' blank':''}"><div class="art" style="width:${size}mm;height:${size}mm">${c.blank?'':picSVG(c.pic,c.key,size,S.start&&!c.half,null,null,c.half)}</div>${S.names?`<div class="lab">${esc(c.label)}</div>`:''}</div>`;
  });
  return h+'</div>'+footer(footL)+'</div>';
}
function queue(){
  const arr=LIB[S.lib].filter(p=>S.sel.has(p.id));let seed=S.seed*9973;
  const r=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  let i=0;return ()=>arr[i++%arr.length];
}
const decoRow=(ids,mm,off=0)=>`<div class="cv-row">${ids.map((id,i)=>picSVG(byId(id),'solid',mm,false,COL[(i+off)%4],1.3)).join('')}</div>`;
function cover(){
  const d=D(),mm=30*d.f;
  return pageOpen(d,'cover')+`<div class="cv">${decoRow(S.lib==='geo'?['circle','tri','square']:['cat','rabbit','apple'],mm)}<div class="cv-t">${esc(S.btitle)}</div><div class="cv-s">${S.weeks} 週運筆描畫練習</div><div class="cv-me">畫畫我自己</div><div class="cv-own"><span>這本手冊屬於</span><i></i></div>${decoRow(S.lib==='geo'?['wave','pstar','heartg']:['car','sun','fish'],mm,1)}</div></div>`;
}
function guide(){
  const d=D(),who=S.lib==='geo'?'練習者':'孩子';
  const startLi=S.start?'<li><b>從綠點出發</b>綠點是起點，沿著線慢慢畫，不用急。</li>':'<li><b>從線的一端出發</b>找到線的開頭，沿著線慢慢畫，不用急。</li>';
  return pageOpen(d,'doc')+`<div class="docin"><h2>給陪伴的大人</h2><p class="lead">${S.lib==='geo'?'運筆練習能幫助手指、手腕和手臂學會控制筆的方向與力道，也是寫字和日常手部活動的基礎。':'運筆練習是寫字前的準備，讓手指和手腕學會控制筆的方向與力道。'}${S.lib==='geo'?'從一兩筆就能完成的線條和形狀開始，容易成功，也容易看見進步。':'用孩子喜歡的圖案來描，練習起來會更有動力。'}</p><ol>
<li><b>坐好再開始</b>雙腳踩地，身體靠近桌子，另一隻手幫忙壓住紙。</li>
${S.arrows?'<li><b>看箭頭的方向</b>橘色箭頭指出下筆的方向，照著箭頭畫。</li>':''}<li><b>先用手指走一次</b>沿著線用手指描一遍，再拿起筆。</li>${startLi}
<li><b>畫歪沒關係</b>鼓勵${who}回到線上繼續畫，不一定要擦掉。</li>
<li><b>完成後塗星星</b>讓${who}自己把頁首的星星塗上顏色，也可以幫圖案著色。</li>
<li><b>一天一頁就好</b>每天固定一小段時間練習，天天做比一次做很多更重要。</li></ol>
<h3>這本手冊的安排</h3><p>${MODE_HINT[S.mode]}${S.progress&&S.mode!=='prog'?'線條會隨著週數慢慢變淡、變少，讓${who}越來越能自己控制筆。':''}每完成一天，就在「我的練習紀錄」塗一顆星；全部完成後，最後一頁是完成證書。</p></div></div>`;
}
function record(){
  const d=D(),rowH=Math.min(22*d.f,(d.h-2*d.m-62*d.f)/(S.weeks+1));
  let t=`<tr><th class="wk"></th>${range(S.days).map(i=>`<th>第 ${i} 天</th>`).join('')}<th class="fav">最喜歡的圖案</th></tr>`;
  range(S.weeks).forEach(w=>{t+=`<tr style="height:${rowH.toFixed(1)}mm"><td>第 ${w} 週</td>${range(S.days).map(()=>`<td>${STAR}</td>`).join('')}<td></td></tr>`;});
  return pageOpen(d,'doc')+`<div class="docin"><h2>我的練習紀錄</h2><p class="lead">每完成一天，就把那天的星星塗上顏色。</p><table class="rec">${t}</table></div></div>`;
}
function cert(){
  const d=D(),mm=26*d.f;
  return pageOpen(d,'cover')+`<div class="cv">${decoRow(['star','heart','balloon'],mm,2)}<div class="ce-t">我完成了！</div><div class="ce-l"><i></i><span>完成了 ${S.weeks} 週的運筆描畫練習</span><span>每一條線，都是自己畫出來的</span></div><div class="sts big">${STAR.repeat(5)}</div><div class="ce-s"><span>陪伴的大人</span><i></i><span>日期</span><i class="sh"></i></div>${decoRow(S.lib==='geo'?['spiral','diamond','infinity']:['flower','rainbow','bird'],mm,1)}</div></div>`;
}

const pagesEl=document.getElementById('pages');
let total=0;
function render(){
  document.getElementById('pagesize').textContent=`@page{size:${S.paper} portrait;margin:0}`;
  if(!S.sel.size){pagesEl.innerHTML='<div class="empty">先在左邊選幾個圖案，學習單就會出現在這裡。</div>';document.getElementById('count').textContent='尚未選圖案';total=0;return;}
  const next=queue();let h='';total=0;
  const take=()=>S.mode==='trace'&&S.repeat&&S.tab==='single'?Array(S.n).fill(next()):Array.from({length:S.n},next);
  if(S.tab==='single'){
    range(S.pages).forEach(p=>{h+=sheet(S.title,layout(S.mode,take(),S.style),S.pages>1?`第 ${p} 頁`:'');total++;});
  }else{
    h+=cover()+guide()+record();total+=3;
    range(S.weeks).forEach(w=>{
      const key=S.progress?STAGES[S.lib][Math.min(3,Math.floor((w-1)*4/S.weeks))]:S.style;
      range(S.days).forEach(dd=>{h+=sheet(`第 ${w} 週　第 ${dd} 天`,layout(S.mode,take(),key),S.btitle);total++;});
    });
    h+=cert();total++;
  }
  pagesEl.innerHTML=h;addDots(pagesEl);addStarts(pagesEl);
  document.getElementById('count').textContent=`共 ${total} 頁　${S.paper}`;
  fit();
}
function fit(){const d=D();const avail=pagesEl.parentElement.clientWidth;pagesEl.style.zoom=Math.min(1,(avail-6)/(d.w*MM));}
let raf;const update=()=>{sync();cancelAnimationFrame(raf);raf=requestAnimationFrame(render);};

// thumbs & chips
const thumbsEl=document.getElementById('thumbs'),chipsEl=document.getElementById('chips');
let thumbLib='';const buildThumbs=()=>{if(thumbLib===S.lib)return;thumbLib=S.lib;thumbsEl.innerHTML=LIB[S.lib].map(p=>`<button class="thumb" data-id="${p.id}" title="${p.name}" aria-label="${p.name}">${picSVG(p,'solid',28)}</button>`).join('');};
thumbsEl.addEventListener('click',e=>{const b=e.target.closest('.thumb');if(!b)return;const id=b.dataset.id;S.sel.has(id)?S.sel.delete(id):S.sel.add(id);update();});
chipsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const all=LIB[S.lib].filter(p=>p.cat===b.dataset.c);const full=all.every(p=>S.sel.has(p.id));all.forEach(p=>full?S.sel.delete(p.id):S.sel.add(p.id));update();});
document.getElementById('selAll').onclick=()=>{LIB[S.lib].forEach(p=>S.sel.add(p.id));update();};
document.getElementById('selNone').onclick=()=>{S.sel.clear();update();};
document.getElementById('shuffle').onclick=()=>{S.seed++;update();};
document.getElementById('print').onclick=()=>window.print();

document.querySelectorAll('.seg[data-k]').forEach(seg=>seg.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const k=seg.dataset.k;S[k]=k==='n'?+b.dataset.v:b.dataset.v;
  if(k==='lib'){S.n=S.lib==='geo'?2:4;S.arrows=S.lib==='geo';S.style=S.lib==='geo'?'bold':'dash';document.querySelector('input[data-k=arrows]').checked=S.arrows;}
  if(k==='mode'||k==='lib'){const o=NOPT[S.mode];if(!o.includes(S.n))S.n=o.filter(v=>v<=S.n).pop()||o[0];}
  update();
}));
document.querySelectorAll('.num').forEach(el=>{const k=el.dataset.k,min=+el.dataset.min,max=+el.dataset.max;const [dec,inc]=el.querySelectorAll('button');
  dec.onclick=()=>{S[k]=Math.max(min,S[k]-1);update();};inc.onclick=()=>{S[k]=Math.min(max,S[k]+1);update();};});
document.querySelectorAll('input[type=text][data-k]').forEach(i=>{i.value=S[i.dataset.k];i.addEventListener('input',()=>{S[i.dataset.k]=i.value;update();});});
document.querySelectorAll('input[type=checkbox][data-k]').forEach(i=>{i.checked=S[i.dataset.k];i.addEventListener('change',()=>{S[i.dataset.k]=i.checked;update();});});

function sync(){
  document.getElementById('nSeg').innerHTML=NOPT[S.mode].map(v=>`<button data-v="${v}">${S.mode==='trace'?v+' 個':v+' 組'}</button>`).join('');
  document.querySelectorAll('.seg[data-k]').forEach(seg=>seg.querySelectorAll('button').forEach(b=>{const on=String(S[seg.dataset.k])===b.dataset.v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);}));
  document.querySelectorAll('.num').forEach(el=>el.querySelector('output').textContent=S[el.dataset.k]);
  document.querySelectorAll('.only-single').forEach(e=>e.classList.toggle('hide',S.tab!=='single'));
  document.querySelectorAll('.only-book').forEach(e=>e.classList.toggle('hide',S.tab!=='book'));
  document.querySelectorAll('.only-trace').forEach(e=>e.classList.toggle('hide',S.mode!=='trace'));
  const lockStyle=S.mode==='prog'||(S.tab==='book'&&S.progress);
  document.querySelector('#secStyle .seg').classList.toggle('hide',lockStyle);
  document.getElementById('styleHint').textContent=S.mode==='prog'?'由描到畫會自動安排四格：淡線、虛線、描一半畫一半、自己畫。':(S.tab==='book'&&S.progress)?(S.lib==='geo'?'手冊會從特粗虛線開始，逐週換成淡色實線、粗虛線、點點線。':'手冊會從淡色實線開始，逐週換成虛線、點點線、細虛線。'):STYLE_HINT[S.style];
  document.getElementById('modeHint').textContent=MODE_HINT[S.mode];
  buildThumbs();
  document.getElementById('libHint').textContent=S.lib==='geo'?'一兩筆就能畫完的線條與形狀，適合復健或非常入門的練習者。':'動物、蔬果、生活小物與自然，多筆畫的可愛圖案。';
  thumbsEl.querySelectorAll('.thumb').forEach(b=>{const on=S.sel.has(b.dataset.id);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
  chipsEl.innerHTML=CATS[S.lib].map(c=>{const all=LIB[S.lib].filter(p=>p.cat===c.id),on=all.filter(p=>S.sel.has(p.id)).length;return `<button data-c="${c.id}" class="${on===all.length?'on':on?'part':''}">${c.name}<span>${on}/${all.length}</span></button>`;}).join('');
  document.getElementById('selCount').textContent=`已選 ${S.sel.size} 個`;
}

// hero: the cat draws itself over its tracing guide
(function(){
  const cat=byId('cat');
  document.getElementById('hero').innerHTML=`<svg viewBox="-4 -4 108 108"><g class="guide" fill="none" stroke="#C3D2D4" stroke-width="3" stroke-dasharray="5 4.5" stroke-linecap="round">${cat.s}</g><g class="draw" fill="none" stroke="#E8552D" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">${cat.s}</g></svg>`;
  let t=.3;document.querySelectorAll('#hero .draw > *').forEach(el=>{
    if(el.classList.contains('dot')){el.style.animationDelay=(t+.1)+'s';return;}
    el.setAttribute('pathLength','1');el.style.animationDelay=t+'s';t+=.28;
  });
  document.querySelectorAll('#hero .draw .dot').forEach(el=>el.style.animationDelay=(t)+'s');
})();

addEventListener('resize',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(fit);});
sync();render();
if(document.fonts)document.fonts.ready.then(fit);
</script>
</body>
